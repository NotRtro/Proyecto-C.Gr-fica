<script type="module">

    '<div id="guard">Esto no funciona abierto como archivo local.<br/>' +

import * as THREE from "three";

const Q = new URLSearchParams(location.search);
const ROLE = Q.get("role") || "stage";
if (ROLE === "render") document.body.classList.add("render");

let items = [];
let cursors = {};

const RING_COLORS = { idle: "#7c93a8", listening: "#33d1ff", thinking: "#ffb238", speaking: "#33ff9c" };

// Umbrales de pinch (docs/05): entrar exige mas confianza que sostener (histéresis).
// arch/backMean vienen documentados; los cortes de "ratio" son un punto de partida
// a recalibrar en vivo con el overlay de debug (tecla H).
const RATIO_ENTER = 0.35, RATIO_HOLD = 0.45;
const ARCH_ENTER = 0.18, BACKMEAN_ENTER = 1.30;
const ARCH_HOLD = 0.12, BACKMEAN_HOLD = 1.15;
const TAP_MAX_MS = 300, TAP_MAX_PX = 26;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function isFx(src) { return typeof src === "string" && src.includes("/fx/"); }

function toVideoPx(lm, video) {
  return { x: lm.x * video.videoWidth, y: lm.y * video.videoHeight };
}

function toScreen(lm, video) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return { x: 0, y: 0 };
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (innerWidth - dw) / 2, oy = (innerHeight - dh) / 2;
  const sx = 1 - lm.x; // espejo self-view del tracker
  return { x: ox + sx * dw, y: oy + lm.y * dh };
}

function pinchMetrics(lm, video) {
  const P = lm.map((p) => toVideoPx(p, video));
  const span = dist(P[0], P[9]);
  const gap = dist(P[4], P[8]);
  const ratio = gap / Math.max(span, 1e-3);
  const f8 = dist(P[8], P[0]) / Math.max(dist(P[5], P[0]), 1e-3);
  const f12 = dist(P[12], P[0]) / Math.max(dist(P[9], P[0]), 1e-3);
  const f16 = dist(P[16], P[0]) / Math.max(dist(P[13], P[0]), 1e-3);
  const f20 = dist(P[20], P[0]) / Math.max(dist(P[17], P[0]), 1e-3);
  const backMean = (f12 + f16 + f20) / 3;
  return { ratio, arch: backMean - f8, backMean, span };
}

function pinchTransition(wasPinched, m) {
  if (!wasPinched) {
    return m.arch > ARCH_ENTER && m.backMean > BACKMEAN_ENTER && m.ratio < RATIO_ENTER;
  }
  return m.arch > ARCH_HOLD && m.backMean > BACKMEAN_HOLD && m.ratio < RATIO_HOLD;
}

// ---- construccion de DOM (compartida entre tracker y render page) ----

function buildCardEl() {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = '<div class="card-title"></div><div class="card-body"></div>';
  return el;
}
function updateCardEl(el, def) {
  el.querySelector(".card-title").textContent = def.title || "";
  el.querySelector(".card-body").textContent = def.body || "";
}
function buildImageEl(def) {
  const isVideo = /\.(webm|mp4)(\?|$)/i.test(def.src || "");
  const el = document.createElement(isVideo ? "video" : "img");
  if (isVideo) { el.muted = true; el.loop = true; el.playsInline = true; el.autoplay = true; }
  el.src = "/media/" + (def.src || "");
  el.className = "propimg " + (isFx(def.src) ? "fx" : "framed");
  return el;
}
function buildRingEl() {
  const wrap = document.createElement("div");
  wrap.className = "ringcard";
  const canvas = document.createElement("canvas");
  canvas.width = 440; canvas.height = 440;
  wrap.appendChild(canvas);
  return { wrap, canvas, ctx: canvas.getContext("2d") };
}

// ---- reactor holografico (puerto de core/hologram.py a three.js) ----

function torusGeom(R, r, nu, nv) {
  const P = [], N = [];
  for (let i = 0; i < nu; i++) {
    const u = (i / nu) * Math.PI * 2;
    for (let j = 0; j < nv; j++) {
      const v = (j / nv) * Math.PI * 2;
      const cx = (R + r * Math.cos(v)) * Math.cos(u);
      const cy = (R + r * Math.cos(v)) * Math.sin(u);
      const cz = r * Math.sin(v);
      P.push([cx, cy, cz]);
      N.push([Math.cos(v) * Math.cos(u), Math.cos(v) * Math.sin(u), Math.sin(v)]);
    }
  }
  const F = [];
  for (let i = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++) {
      const a = i * nv + j;
      const b = ((i + 1) % nu) * nv + j;
      const c = ((i + 1) % nu) * nv + ((j + 1) % nv);
      const d = i * nv + ((j + 1) % nv);
      F.push([a, b, c], [a, c, d]);
    }
  }
  return { P, N, F };
}

function icosphereGeom(radius, subdiv) {
  const t = (1 + Math.sqrt(5)) / 2;
  let v = [
    [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
    [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
    [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1],
  ];
  let f = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
  ];
  for (let s = 0; s < subdiv; s++) {
    const cache = new Map();
    const mid = (a, b) => {
      const k = a < b ? a + "_" + b : b + "_" + a;
      if (!cache.has(k)) {
        cache.set(k, v.length);
        v.push([(v[a][0] + v[b][0]) / 2, (v[a][1] + v[b][1]) / 2, (v[a][2] + v[b][2]) / 2]);
      }
      return cache.get(k);
    };
    const nf = [];
    for (const [a, b, c] of f) {
      const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
      nf.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
    }
    f = nf;
  }
  const N = v.map((p) => {
    const len = Math.hypot(p[0], p[1], p[2]) || 1;
    return [p[0] / len, p[1] / len, p[2] / len];
  });
  const P = N.map((n) => [n[0] * radius, n[1] * radius, n[2] * radius]);
  return { P, N, F: f };
}

function rotY(p, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return [c * p[0] + s * p[2], p[1], -s * p[0] + c * p[2]];
}
function transformPart(P, N, offset, scale, rotYAng) {
  const P2 = P.map((p) => {
    const r = rotY([p[0] * scale, p[1] * scale, p[2] * scale], rotYAng);
    return [r[0] + offset[0], r[1] + offset[1], r[2] + offset[2]];
  });
  const N2 = N.map((n) => rotY(n, rotYAng));
  return { P: P2, N: N2 };
}

function makeReactorParts() {
  const parts = [];
  { const { P, N, F } = icosphereGeom(0.9, 1); parts.push({ P, N, F, pivot: [0, 0, 0] }); }
  { const { P, N, F } = torusGeom(1.7, 0.16, 30, 7); parts.push({ P, N, F, pivot: [0, 0, 1] }); }
  { const { P, N, F } = torusGeom(2.6, 0.20, 36, 7); parts.push({ P, N, F, pivot: [0, 0, -1] }); }
  {
    let coilsP = [], coilsN = [], coilsF = [], base = 0;
    for (let k = 0; k < 8; k++) {
      const a = (k * 2 * Math.PI) / 8;
      const g = torusGeom(0.34, 0.11, 12, 6);
      const off = [Math.cos(a) * 2.15, Math.sin(a) * 2.15, 0];
      const t = transformPart(g.P, g.N, off, 1.0, a);
      coilsP = coilsP.concat(t.P);
      coilsN = coilsN.concat(t.N);
      coilsF = coilsF.concat(g.F.map((tri) => tri.map((idx) => idx + base)));
      base += g.P.length;
    }
    parts.push({ P: coilsP, N: coilsN, F: coilsF, pivot: [0, 1, 0] });
  }
  { const { P, N, F } = torusGeom(3.3, 0.10, 40, 6); parts.push({ P, N, F, pivot: [0, -1, 0] }); }
  return parts;
}

function buildReactorGeometry() {
  const parts = makeReactorParts();
  const positions = [], normals = [], barys = [], pivots = [];
  for (const { P, N, F, pivot } of parts) {
    for (const tri of F) {
      for (let k = 0; k < 3; k++) {
        const idx = tri[k];
        positions.push(P[idx][0], P[idx][1], P[idx][2]);
        normals.push(N[idx][0], N[idx][1], N[idx][2]);
        barys.push(k === 0 ? 1 : 0, k === 1 ? 1 : 0, k === 2 ? 1 : 0);
        pivots.push(pivot[0], pivot[1], pivot[2]);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute("barycentric", new THREE.Float32BufferAttribute(barys, 3));
  geo.setAttribute("pivot", new THREE.Float32BufferAttribute(pivots, 3));
  return geo;
}

// Shader identico (traducido a GLSL ES 1.00) al de core/hologram.py: fresnel,
// scan lines, ruido fbm para nucleo/venas, wireframe via barycentric, corte
// por disolucion. modelViewMatrix/projectionMatrix reemplazan a los uniforms
// custom u_mvp/u_model de la version Python.
const HOLO_VS = `
attribute vec3 barycentric;
attribute vec3 pivot;
uniform float u_explode;
varying vec3 v_normal;
varying vec3 v_bary;
varying vec3 v_local;
varying vec3 v_view;
void main(){
    vec3 p = position + pivot * u_explode;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    v_normal = normalMatrix * normal;
    v_bary = barycentric;
    v_local = p;
    v_view = -mv.xyz;
    gl_Position = projectionMatrix * mv;
}
`;

const HOLO_FS = `
precision highp float;
varying vec3 v_normal;
varying vec3 v_bary;
varying vec3 v_local;
varying vec3 v_view;
uniform float u_time;
uniform vec3  u_tint;
uniform float u_alpha;
uniform float u_wire;
uniform float u_dissolve;
uniform float u_glow;

float hash31(vec3 p){
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise(vec3 x){
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash31(i + vec3(0.0,0.0,0.0)), hash31(i + vec3(1.0,0.0,0.0)), f.x),
                   mix(hash31(i + vec3(0.0,1.0,0.0)), hash31(i + vec3(1.0,1.0,0.0)), f.x), f.y),
               mix(mix(hash31(i + vec3(0.0,0.0,1.0)), hash31(i + vec3(1.0,0.0,1.0)), f.x),
                   mix(hash31(i + vec3(0.0,1.0,1.0)), hash31(i + vec3(1.0,1.0,1.0)), f.x), f.y), f.z);
}
float fbm(vec3 p){
    float a = 0.5, s = 0.0;
    for(int i = 0; i < 4; ++i){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
    return s;
}

void main(){
    vec3 N = normalize(v_normal);
    vec3 V = normalize(v_view);
    float fres = pow(1.0 - abs(dot(N, V)), 2.2);

    float scan = pow(0.5 + 0.5 * sin(v_local.y * 26.0 - u_time * 5.0), 3.0);

    float e = min(min(v_bary.x, v_bary.y), v_bary.z);
    float wire = 1.0 - smoothstep(0.0, 0.035, e);

    float r = length(v_local);
    float core = 0.0;
    if(r < 1.35){
        float n = fbm(v_local * 2.6 + vec3(0.0, 0.0, u_time * 0.55));
        n += 0.5 * fbm(v_local * 6.0 - vec3(u_time * 0.9, 0.0, 0.0));
        core = smoothstep(0.55, 1.05, n) * (1.0 - smoothstep(0.7, 1.35, r));
    }

    float veins = smoothstep(0.62, 0.95, fbm(v_local * 3.1 + vec3(u_time * 0.7, 0.0, 0.0)));

    float dn = fbm(v_local * 2.2 + 11.0);
    float cut = u_dissolve * 1.25;
    if(dn < cut - 0.10) discard;
    float edge = 1.0 - smoothstep(cut - 0.10, cut + 0.06, dn);

    vec3 hot = vec3(1.0, 0.72, 0.30);
    vec3 col = u_tint * (0.35 + 2.2 * fres + 0.45 * scan + 0.9 * veins)
             + vec3(0.70, 0.95, 1.0) * wire * u_wire * 1.4
             + hot * core * 2.6
             + hot * edge * 4.0;

    float a = 0.30 + 0.95 * fres + 0.22 * scan + 0.85 * wire * u_wire
            + 0.85 * core + 0.5 * veins + edge;
    a = clamp(a * u_alpha, 0.0, 1.0);
    gl_FragColor = vec4(col * u_glow, a);
}
`;

function buildHoloMaterial() {
  return new THREE.ShaderMaterial({
    vertexShader: HOLO_VS,
    fragmentShader: HOLO_FS,
    uniforms: {
      u_time: { value: 0 },
      u_explode: { value: 0 },
      u_tint: { value: new THREE.Vector3(0.25, 0.85, 1.0) },
      u_alpha: { value: 1.0 },
      u_wire: { value: 1.0 },
      u_dissolve: { value: 0.0 },
      u_glow: { value: 1.8 },
    },
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
}

function buildModelEl() {
  const wrap = document.createElement("div");
  wrap.className = "modelcard";
  const canvas = document.createElement("canvas");
  wrap.appendChild(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(480, 480, false);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 8);
  const group = new THREE.Group();
  const mat = buildHoloMaterial();
  group.add(new THREE.Mesh(buildReactorGeometry(), mat));
  scene.add(group);
  return { wrap, canvas, renderer, scene, camera, group, mat };
}

function drawRing(ctx, ring, size, t, name) {
  ctx.clearRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2;
  const color = RING_COLORS[ring.state] || RING_COLORS.idle;
  ctx.strokeStyle = color;
  ctx.lineWidth = size * 0.02;
  ctx.beginPath(); ctx.arc(cx, cy, size * 0.42, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.arc(cx, cy, size * 0.34, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  if (ring.state === "thinking") {
    ctx.lineWidth = size * 0.03;
    ctx.beginPath(); ctx.arc(cx, cy, size * 0.38, t * 2, t * 2 + Math.PI * 0.6); ctx.stroke();
  }
  if (ring.state === "speaking") {
    const amp = ring.wave && ring.wave.length
      ? ring.wave.reduce((a, b) => a + b, 0) / ring.wave.length : 0.3;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, size * (0.20 + 0.05 * amp), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#eaf3ff";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = Math.round(size * 0.07) + "px sans-serif";
  ctx.fillText(name || "Assistant", cx, cy - size * 0.02);
  ctx.fillStyle = color;
  ctx.font = Math.round(size * 0.045) + "px sans-serif";
  ctx.fillText(ring.state || "idle", cx, cy + size * 0.09);
}

// ==================== TRACKER ====================

function applyItemTransform(item) {
  item.el.style.position = "absolute";
  item.el.style.left = "0"; item.el.style.top = "0";
  item.el.style.transform =
    "translate(-50%,-50%) translate(" + item.x + "px," + item.y + "px) scale(" + item.scale + ")";
}

function makeCard(def) {
  const el = buildCardEl();
  updateCardEl(el, def);
  document.getElementById("behind").appendChild(el);
  const item = {
    id: "i" + (UID++), type: "card", el,
    title: def.title || "", body: def.body || "",
    x: (def.x ?? 0.5) * innerWidth, y: (def.y ?? 0.4) * innerHeight,
    scale: 1, rx: 0, ry: 0, rz: 0,
  };
  items.push(item);
  applyItemTransform(item);
  return item;
}

function makeImage(def) {
  const el = buildImageEl(def);
  document.getElementById("behind").appendChild(el);
  const item = {
    id: "i" + (UID++), type: "img", el,
    title: def.title || "", src: def.src || "",
    x: (def.x ?? 0.5) * innerWidth, y: (def.y ?? 0.6) * innerHeight,
    scale: 1, rx: 0, ry: 0, rz: 0,
  };
  items.push(item);
  applyItemTransform(item);
  return item;
}

function makeHolo(def) {
  const m = buildModelEl();
  document.getElementById("behind").appendChild(m.wrap);
  const item = {
    id: "i" + (UID++), type: "holo", el: m.wrap,
    renderer: m.renderer, scene: m.scene, camera: m.camera, group: m.group, mat: m.mat,
    title: def.title || "Reactor",
    x: (def.x ?? 0.5) * innerWidth, y: (def.y ?? 0.45) * innerHeight,
    scale: 1, rx: 0, ry: 0, rz: 0,
    explode: 0, explodeTarget: 0, dissolve: 0, dissolveTarget: 0,
  };
  items.push(item);
  applyItemTransform(item);
  return item;
}

function holoItem() { return items.find((it) => it.type === "holo"); }

function updateHolo(item, dt, now) {
  item.ry += 0.55 * dt;
  item.group.rotation.y = item.ry;
  item.explode += (item.explodeTarget - item.explode) * (1 - Math.exp(-5 * dt));
  item.dissolve += (item.dissolveTarget - item.dissolve) * (1 - Math.exp(-3.2 * dt));
  item.mat.uniforms.u_time.value = now / 1000;
  item.mat.uniforms.u_explode.value = item.explode;
  item.mat.uniforms.u_dissolve.value = item.dissolve;
  item.renderer.render(item.scene, item.camera);
}

function spawnStage() {
  const ring = buildRingEl();
  document.getElementById("behind").appendChild(ring.wrap);
  const item = {
    id: "ring", type: "widget", el: ring.wrap, ctx: ring.ctx,
    x: innerWidth / 2, y: innerHeight / 2, scale: 1, rx: 0, ry: 0, rz: 0,
  };
  items.push(item);
  applyItemTransform(item);
  makeHolo({});
  return item;
}

function ringItem() { return items.find((it) => it.type === "widget"); }

function clearAll() {
  items = items.filter((it) => {
    if (it.type === "widget") return true;
    it.el.remove();
    return false;
  });
  for (const c of Object.values(cursors)) endGrab(c);
}

function resetAll() {
  clearAll();
  const ring = ringItem();
  if (ring) { ring.x = innerWidth / 2; ring.y = innerHeight / 2; applyItemTransform(ring); }
  makeHolo({});
}

function applyCmds(cmds) {
  for (const c of cmds || []) {
    switch (c.a) {
      case "add_card": makeCard({ title: c.title, body: c.body, x: c.x, y: c.y }); break;
      case "add_img": makeImage({ src: c.src, title: c.title, x: c.x, y: c.y }); break;
      case "clear": clearAll(); break;
      case "reset": resetAll(); break;
      case "hand": if (!holoItem()) makeHolo({ title: c.title, x: c.x, y: c.y }); break;
      case "explode": { const h = holoItem(); if (h) h.explodeTarget = 2.2; break; }
      case "assemble": { const h = holoItem(); if (h) h.explodeTarget = 0.0; break; }
      default: console.debug("[barehands] comando sin manejar todavia:", c.a, c);
    }
  }
}

function hitTest(x, y) {
  const els = document.elementsFromPoint(x, y);
  for (const el of els) {
    const item = items.find((it) => it.type !== "widget" && (it.el === el || it.el.contains(el)));
    if (item) return item;
  }
  return null;
}

function createCursor(label) {
  const el = document.createElement("div");
  el.className = "cursor";
  document.getElementById("behind").appendChild(el);
  return { label, el, x: 0, y: 0, pinched: false, pinchStart: 0, startPos: { x: 0, y: 0 },
    grabbedItemId: null, offset: { x: 0, y: 0 }, metrics: null };
}

function beginGrab(cur, item) {
  cur.grabbedItemId = item.id;
  cur.offset = { x: item.x - cur.x, y: item.y - cur.y };
  item.el.classList.add("grabbed");
}
function endGrab(cur) {
  if (cur.grabbedItemId) {
    const it = items.find((i) => i.id === cur.grabbedItemId);
    if (it) it.el.classList.remove("grabbed");
  }
  cur.grabbedItemId = null;
}

function positionCursorEl(cur) {
  cur.el.style.transform = "translate(-50%,-50%) translate(" + cur.x + "px," + cur.y + "px)";
  cur.el.classList.toggle("pinched", cur.pinched);
}

function updateCursorsFromHandResults(res, video, now) {
  const seen = new Set();
  const hands = res.landmarks || [];
  const handedness = res.handedness || [];
  for (let i = 0; i < hands.length; i++) {
    const lm = hands[i];
    const label = (handedness[i] && handedness[i][0] && handedness[i][0].categoryName) || ("hand" + i);
    seen.add(label);
    let cur = cursors[label];
    if (!cur) cur = cursors[label] = createCursor(label);

    const m = pinchMetrics(lm, video);
    const wasPinched = cur.pinched;
    cur.pinched = pinchTransition(cur.pinched, m);
    cur.metrics = m;

    const pos = midpoint(toScreen(lm[8], video), toScreen(lm[4], video));
    cur.x = pos.x; cur.y = pos.y;

    if (!wasPinched && cur.pinched) {
      cur.pinchStart = now;
      cur.startPos = { x: cur.x, y: cur.y };
      const hit = hitTest(cur.x, cur.y);
      if (hit) beginGrab(cur, hit);
    }

    if (cur.grabbedItemId) {
      const item = items.find((it) => it.id === cur.grabbedItemId);
      if (item) {
        const tx = cur.x + cur.offset.x, ty = cur.y + cur.offset.y;
        item.x += (tx - item.x) * 0.5;
        item.y += (ty - item.y) * 0.5;
        applyItemTransform(item);
      }
    }

    if (wasPinched && !cur.pinched) {
      const duration = now - cur.pinchStart;
      const travel = dist(cur.startPos, { x: cur.x, y: cur.y });
      if (duration < TAP_MAX_MS && travel < TAP_MAX_PX) {
        const hit = hitTest(cur.startPos.x, cur.startPos.y);
        if (hit && hit.type === "card") hit.el.classList.toggle("expanded");
      }
      endGrab(cur);
    }

    positionCursorEl(cur);
  }
  for (const label of Object.keys(cursors)) {
    if (!seen.has(label)) {
      endGrab(cursors[label]);
      cursors[label].el.remove();
      delete cursors[label];
    }
  }
}

async function pushState(now) {
  const ring = ringItem();
  const payload = {
    cursors: {}, items: [],
    ring: { state: RING.state, mood: RING.mood, wave: RING.wave, name: CFG.name },
  };
  for (const [label, c] of Object.entries(cursors)) {
    payload.cursors[label] = { x: c.x / innerWidth, y: c.y / innerHeight, p: c.pinched ? 1 : 0, d: 0 };
  }
  for (const it of items) {
    payload.items.push({
      id: it.id, type: it.type, title: it.title || "", body: it.body || "", src: it.src || "",
      x: it.x / innerWidth, y: it.y / innerHeight, scale: it.scale || 1,
      rx: it.rx || 0, ry: it.ry || 0, rz: it.rz || 0,
      explode: it.explode || 0, dissolve: it.dissolve || 0,
    });
  }
  try {
    const res = await fetch("/state", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data && data.cmds) applyCmds(data.cmds);
  } catch (e) { /* servidor no disponible; se reintenta el siguiente frame */ }
}

async function pollRing() {
  try { RING = await fetch("/orb", { cache: "no-store" }).then((r) => r.json()); }
  catch (e) { /* se reintenta en el proximo poll */ }
}

async function openCamera() {
  const video = document.getElementById("cam");
  const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
  const camQuery = Q.get("cam");
  if (camQuery) {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const match = devices.find(
        (d) => d.kind === "videoinput" && d.label.toLowerCase().includes(camQuery.toLowerCase()));
      if (match) constraints.video.deviceId = { exact: match.deviceId };
    } catch (e) { /* enumerateDevices puede fallar sin permiso previo; se ignora */ }
  }
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await video.play();
  try {
    camDevices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  } catch (e) { /* no critico */ }
}

async function cycleCamera() {
  if (!camDevices.length) return;
  camIndex = (camIndex + 1) % camDevices.length;
  const video = document.getElementById("cam");
  if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia(
    { video: { deviceId: { exact: camDevices[camIndex].deviceId } }, audio: false });
  video.srcObject = stream;
  await video.play();
}

function updateHud(fps) {
  const lines = ["fps " + fps.toFixed(1)];
  for (const [label, c] of Object.entries(cursors)) {
    const m = c.metrics || {};
    lines.push(label + ": pinch=" + c.pinched
      + " ratio=" + (m.ratio ?? 0).toFixed(2)
      + " arch=" + (m.arch ?? 0).toFixed(2)
      + " back=" + (m.backMean ?? 0).toFixed(2));
  }
  document.getElementById("hud").textContent = lines.join("\n");
}

function onKeyDown(e) {
  if (e.key === "r" || e.key === "R") location.reload();
  else if (e.key === "c" || e.key === "C") cycleCamera();
  else if (e.key === "h" || e.key === "H") {
    showHud = !showHud;
    document.getElementById("hud").classList.toggle("visible", showHud);
  }
}

let lastFrameT = performance.now();
let fps = 0;

function frame(now) {
  const dt = (now - lastFrameT) / 1000;
  lastFrameT = now;
  fps = fps * 0.9 + (dt > 0 ? 0.1 / dt : 0);

  const video = document.getElementById("cam");
  if (landmarker && video.readyState >= 2) {
    const res = landmarker.detectForVideo(video, now);
    updateCursorsFromHandResults(res, video, now);
  }
  const ring = ringItem();
  if (ring) drawRing(ring.ctx, RING, 440, now / 1000, CFG.name);
  const holo = holoItem();
  if (holo) updateHolo(holo, dt, now);
  if (showHud) updateHud(fps);
  pushState(now);
  requestAnimationFrame(frame);
}

function showBootError(message) {
  const div = document.createElement("div");
  div.id = "guard";
  div.textContent = message;
  document.body.appendChild(div);
}

async function boot() {
  spawnStage();
  try {
    const { FilesetResolver, HandLandmarker } =
      await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      },
      runningMode: "VIDEO",
      numHands: 2,
      minHandDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
  } catch (e) {
    showBootError("No se pudo cargar MediaPipe (revisa tu conexion a internet). " + e);
  }
  try { CFG = await fetch("/config").then((r) => r.json()); } catch (e) { /* usa defaults */ }
  try {
    await openCamera();
  } catch (e) {
    showBootError(
      "No se pudo abrir la camara: " + (e && e.message ? e.message : e) + "\n" +
      "Revisa permisos del navegador, que ninguna otra app la este usando, " +
      "o proba otra camara con ?cam=<nombre>.");
  }
  window.addEventListener("keydown", onKeyDown);
  setInterval(pollRing, 750);
  requestAnimationFrame(frame);
}

// ==================== RENDER PAGE (?role=render, para OBS) ====================

const HIDE_CURSORS = Q.get("cursors") === "0";
const RFLIP = Q.get("mirror") === "1" ? false : true;
function rxFrac(f) { return RFLIP ? 1 - f : f; }

let renderItems = {};
let renderCursors = {};

function createRenderItem(def) {
  let el, ctx = null, holo = null;
  if (def.type === "card") el = buildCardEl();
  else if (def.type === "img") el = buildImageEl(def);
  else if (def.type === "holo") { holo = buildModelEl(); el = holo.wrap; }
  else { const r = buildRingEl(); el = r.wrap; ctx = r.ctx; }
  document.getElementById("behind").appendChild(el);
  return {
    id: def.id, type: def.type, el, ctx, holo,
    x: rxFrac(def.x || 0) * innerWidth, y: (def.y || 0) * innerHeight, scale: 1,
    ry: 0, explode: 0, dissolve: 0,
    lastSrc: def.type === "img" ? def.src : undefined,
  };
}

function applyRenderTransform(ri) {
  ri.el.style.position = "absolute";
  ri.el.style.left = "0"; ri.el.style.top = "0";
  ri.el.style.transform =
    "translate(-50%,-50%) translate(" + ri.x + "px," + ri.y + "px) scale(" + ri.scale + ")";
}

function reconcileItems(list, ring) {
  const seen = new Set();
  for (const def of list) {
    seen.add(def.id);
    let ri = renderItems[def.id];
    if (!ri) ri = renderItems[def.id] = createRenderItem(def);
    if (ri.type === "card") updateCardEl(ri.el, def);
    if (ri.type === "img" && ri.lastSrc !== def.src) { ri.el.src = "/media/" + def.src; ri.lastSrc = def.src; }
    const tx = rxFrac(def.x || 0) * innerWidth, ty = (def.y || 0) * innerHeight;
    ri.x += (tx - ri.x) * 0.5;
    ri.y += (ty - ri.y) * 0.5;
    ri.scale += ((def.scale || 1) - ri.scale) * 0.5;
    applyRenderTransform(ri);
    if (ri.type === "widget") drawRing(ri.ctx, ring, 440, performance.now() / 1000, ring.name);
    if (ri.type === "holo" && ri.holo) {
      ri.ry += ((def.ry || 0) - ri.ry) * 0.5;
      ri.explode += ((def.explode || 0) - ri.explode) * 0.5;
      ri.dissolve += ((def.dissolve || 0) - ri.dissolve) * 0.5;
      ri.holo.group.rotation.y = ri.ry;
      ri.holo.mat.uniforms.u_time.value = performance.now() / 1000;
      ri.holo.mat.uniforms.u_explode.value = ri.explode;
      ri.holo.mat.uniforms.u_dissolve.value = ri.dissolve;
      ri.holo.renderer.render(ri.holo.scene, ri.holo.camera);
    }
  }
  for (const id of Object.keys(renderItems)) {
    if (!seen.has(id)) { renderItems[id].el.remove(); delete renderItems[id]; }
  }
}

function reconcileCursors(defs) {
  const seen = new Set();
  for (const [label, def] of Object.entries(defs)) {
    seen.add(label);
    let rc = renderCursors[label];
    if (!rc) {
      const el = document.createElement("div");
      el.className = "cursor";
      document.getElementById("behind").appendChild(el);
      rc = renderCursors[label] = { el, x: 0, y: 0 };
    }
    const tx = rxFrac(def.x || 0) * innerWidth, ty = (def.y || 0) * innerHeight;
    rc.x += (tx - rc.x) * 0.5;
    rc.y += (ty - rc.y) * 0.5;
    rc.el.style.transform = "translate(-50%,-50%) translate(" + rc.x + "px," + rc.y + "px)";
    rc.el.classList.toggle("pinched", !!def.p);
  }
  for (const label of Object.keys(renderCursors)) {
    if (!seen.has(label)) { renderCursors[label].el.remove(); delete renderCursors[label]; }
  }
}

async function renderLoop() {
  try {
    const st = await fetch("/state", { cache: "no-store" }).then((r) => r.json());
    reconcileItems(st.items || [], st.ring || { state: "idle", mood: "green", wave: [], name: "Assistant" });
    if (!HIDE_CURSORS) reconcileCursors(st.cursors || {});
  } catch (e) { /* servidor no disponible; se reintenta el siguiente frame */ }
  requestAnimationFrame(renderLoop);
}

// ==================== ENTRADA ====================

if (ROLE === "render") requestAnimationFrame(renderLoop);
else boot();
</script>
</body>
