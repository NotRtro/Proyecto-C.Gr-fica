<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>barehands</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c;
    color: #eaf3ff; font-family: system-ui, sans-serif; user-select: none; }
  body.render { background: transparent; }

  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); z-index: 0; }
  body.render #cam { display: none; }

  #behind { position: fixed; inset: 0; perspective: 1200px; z-index: 1; }

  .card { position: absolute; min-width: 220px; max-width: 320px; padding: 14px 16px;
    border-radius: 14px; background: rgba(20, 26, 38, 0.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
  .card-title { font-weight: 600; font-size: 15px; margin-bottom: 6px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
  .card-body { font-size: 13px; line-height: 1.4; opacity: 0.9; max-height: 4.4em;
    overflow: hidden; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); white-space: pre-wrap; }
  .card.expanded .card-body { max-height: 40vh; overflow: auto; }
  .card.grabbed { border-color: rgba(120, 200, 255, 0.9);
    box-shadow: 0 8px 30px rgba(60, 160, 255, 0.35); }

  .propimg { max-width: 38vw; max-height: 38vh; border-radius: 10px; display: block; }
  .propimg.framed { padding: 10px; background: rgba(20, 26, 38, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.16); backdrop-filter: blur(6px); }
  .propimg.fx { background: none; border: none; padding: 0; }
  .propimg.grabbed { outline: 2px solid rgba(120, 200, 255, 0.9); }

  .ringcard { position: absolute; width: 440px; height: 440px; pointer-events: none; }
  .ringcard canvas { width: 100%; height: 100%; }

  .modelcard { position: absolute; width: 480px; height: 480px; }
  .modelcard canvas { width: 100%; height: 100%; display: block; }
  .modelcard.grabbed { filter: drop-shadow(0 0 18px rgba(120, 200, 255, 0.45)); }

  .cursor { position: absolute; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.85); pointer-events: none; }
  .cursor.pinched { width: 12px; height: 12px; background: rgba(120, 200, 255, 0.85);
    border-color: rgba(120, 200, 255, 0.95); }
  .cursor.lost { opacity: 0.35; }

  #badge { position: fixed; right: 12px; top: 10px; padding: 6px 10px; border-radius: 8px;
    font: 12px/1.3 monospace; background: rgba(0, 0, 0, 0.55); display: none; z-index: 5; }
  #badge.visible { display: block; }

  #hud { position: fixed; left: 10px; top: 10px; padding: 8px 10px; font: 12px/1.4 monospace;
    background: rgba(0, 0, 0, 0.55); border-radius: 8px; white-space: pre; display: none; z-index: 5; }
  #hud.visible { display: block; }

  #guard { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 15px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="behind"></div>
<pre id="hud"></pre>
<div id="badge"></div>

<!-- Guardia file:// + carga del modulo principal. Los modulos ES no cargan bajo
     file://, por eso se decide aqui con un script clasico. Todo el codigo vive
     en js/ (ver docs/13, "Mapa de modulos"). -->
<script>
if (location.protocol === "file:") {
  document.body.innerHTML =
    '<div id="guard">Esto no funciona abierto como archivo local.<br/>' +
    'Corre <code>python server.py</code> y abre ' +
    '<code>http://127.0.0.1:8794/stage.html</code>.</div>';
} else {
  const s = document.createElement("script");
  s.type = "module";
  s.src = "/js/main.js";
  document.body.appendChild(s);
}
</script>
</body>
</html>
